name: OpenRouter plugin checks

on:
  push:
    branches:
      - feature/openrouter-custom-provider-rpm
  pull_request:
    paths:
      - "plugins/openrouter_plugin/**"
      - ".github/workflows/openrouter-plugin-tests.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install keyring requests
      - name: Compile backend and plugin Python files
        run: python -m compileall -q backend plugins/openrouter_plugin/backend plugins/openrouter_plugin/tests
      - name: Run plugin unit tests
        run: python -m unittest discover -s plugins/openrouter_plugin/tests -v
      - name: Check frontend JavaScript syntax
        run: node --check plugins/openrouter_plugin/frontend/OpenRouterGenerator.js
