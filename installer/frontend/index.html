<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prose Setup</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="pywebview-drag-region">
    <div id="app" v-cloak class="installer-window">
        
        <div class="top-right-controls no-drag">
            <button class="control-btn" @click="store.toggleLanguage()" :data-tooltip="store.currentLang === 'ru' ? 'English' : 'Русский'">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D9D9D9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="2" y1="12" x2="22" y2="12"></line>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10z"></path>
                </svg>
            </button>
            <button class="control-btn close-btn" @click="closeInstaller">✕</button>
        </div>

        <main class="main-content">
            <transition name="slide-fade" mode="out-in">
                
                <!-- ШАГ 1: ПРИВЕТСТВИЕ -->
                <div v-if="store.currentStep === 1" key="step1" class="step-card no-drag">
                    <div class="hero-icons-row">
                        <button class="hero-icon-btn" @click="openLink('https://t.me/BodyaAckerman')">
                            <img src="assets/icons/telegram.png" alt="TG" class="hero-img" onerror="this.style.display='none'">
                        </button>
                        <button class="hero-icon-btn main-logo" @click="openLink('https://github.com/Bodya3101/prose')">
                            <img src="assets/icons/prose.png" alt="Prose" class="hero-img" onerror="this.style.display='none'">
                        </button>
                        <button class="hero-icon-btn" @click="openLink('https://github.com/Bodya3101')">
                            <img src="assets/icons/github.png" alt="GH" class="hero-img" onerror="this.style.display='none'">
                        </button>
                    </div>

                    <h1 class="hero-title">Prose</h1>
                    <div class="hero-version-badge">{{ store.versionName }}</div>

                    <div class="message-box">
                        {{ store.t('welcome_text') }}
                    </div>

                    <div class="nav-footer right-only">
                        <button class="arrow-btn" @click="goToStep2">></button>
                    </div>
                </div>

                <!-- ШАГ 2: ПУТЬ И УСТАНОВКА -->
                <div v-else-if="store.currentStep === 2" key="step2" class="step-card no-drag">
                    <div v-if="!store.isInstalling && !store.installFinished" class="path-selection-area">
                        <div class="section-label">{{ store.t('select_path_label') }}</div>
                        
                        <div class="path-input-group" @dblclick="browseFolder" data-tooltip="Дважды кликните, чтобы открыть проводник">
                            <svg class="folder-icon" @click.stop="browseFolder" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A0A0A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                            </svg>
                            <input type="text" v-model="store.installPath" class="path-input">
                        </div>
                        
                        <div class="checkbox-group">
                            <label class="custom-checkbox">
                                <input type="checkbox" v-model="store.createDesktopShortcut">
                                <span class="checkbox-box"></span>
                                <span>{{ store.t('shortcut_desktop') }}</span>
                            </label>
                            <label class="custom-checkbox">
                                <input type="checkbox" v-model="store.createStartMenuShortcut">
                                <span class="checkbox-box"></span>
                                <span>{{ store.t('shortcut_start_menu') }}</span>
                            </label>
                        </div>

                        <div class="install-btn-wrapper">
                            <button class="install-btn" @click="startInstall">
                                {{ store.isUpdateMode ? store.t('btn_update') : store.t('btn_install') }}
                            </button>
                        </div>
                    </div>

                    <div v-else class="progress-area">
                        <div class="progress-percentage">{{ store.progressPercent }}%</div>
                        <div class="progress-bar-track">
                            <div class="progress-bar-fill" :style="{ width: store.progressPercent + '%' }"></div>
                        </div>
                        <div class="progress-status-file">{{ store.currentExtractFile }}</div>
                    </div>

                    <div class="nav-footer split">
                        <button class="arrow-btn" @click="store.currentStep = 1" :disabled="store.isInstalling"><</button>
                        <button class="arrow-btn" @click="store.currentStep = 3" :disabled="!store.installFinished">></button>
                    </div>
                </div>

                <!-- ШАГ 3: ФИНАЛ -->
                <div v-else-if="store.currentStep === 3" key="step3" class="step-card no-drag">
                    <h1 class="hero-title" style="margin-top: 20px;">Prose</h1>
                    <div class="message-box">
                        {{ store.t('finish_text') }}
                    </div>
                    <div class="finish-btn-wrapper">
                        <button class="finish-btn" @click="finishAndLaunch">{{ store.t('btn_finish') }}</button>
                    </div>
                </div>

            </transition>
        </main>
        
        <div v-if="store.activeIssue" class="modal-overlay no-drag">
            <div class="modal-card">
                <div class="modal-header">
                    <h3 style="color: var(--accent-pink);">{{ store.activeIssue.title }}</h3>
                    <div class="cm-red-dot" @click="store.activeIssue = null"></div>
                </div>
                <p class="modal-text">{{ store.activeIssue.message }}</p>
                <div class="modal-footer">
                    <button class="cp-default-btn" @click="store.activeIssue = null">{{ store.t('btn_close') }}</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ПОДКЛЮЧАЕМ КАК ОБЫЧНЫЕ СКРИПТЫ БЕЗ type="module" -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="js/installer_store.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
